# tier-enforcement-status allowlist
#
# Functions that create a chargeable row (a `projects` or `feedback` INSERT,
# reached through the repository functions the oracle discovers) WITHOUT a
# prior `check_tier_quota` guard, and are exempt for a written reason.
#
# Format:
#   [[callers]]
#   file = "crates/feedbackmonk-api/src/handlers/<file>.rs"   # repo-relative
#   function = "<fn name>"
#   rationale = "<why creating this row without a tier check is correct>"
#
# An entry without a non-empty rationale is itself a FAIL. An exemption
# lets a chargeable row escape the FR-FBR-14 caps, so it needs a spec-level
# reason (a DEC-FBR-* entry), not convenience.
#
# There are NO entries today: every creation path is guarded.
#
# History (2026-09-30): the previous `[[handlers]]` list exempted 13 handlers
# from the old write-pattern scan (signup, verify_email::verify,
# signing_keys::{register,deactivate}, admin_feedback::{transition_status,
# reply}, admin_ops::{patch_tenant,backfill_translations}, and five names
# that no longer existed: promote::promote_to_roadmap, roadmap::{cast_vote,
# retract_vote,admin_create_item,admin_update_item}). None of them creates a
# project or a feedback row, so under the chargeable-row scan none needs an
# exemption; the list was deleted rather than migrated.
