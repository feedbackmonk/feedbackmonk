# --- P5a additions (Contracts C22/C23 / migrations 00013 + 00014) ---
# The five agentic-loop repository constructors. Each is a structural mirror of
# SqlxFeedbackRepo::new (P0 pre-authorized): stores a PgPool handle, performs no
# queries. Every PUBLIC trait method on these repos takes &ProjectScope as its
# first non-&self argument (Probe B compliance verified directly) — clusters,
# recommendations, analysis_sweeps, work_orders, work_order_events all filter by
# tenant_id + project_id on every read/write (DEC-FBR-03). The append_in_executor
# / update_state_in_executor variants take &ProjectScope first, then the caller's
# &mut PgConnection (same shape as SqlxFeedbackStatusHistoryRepo::append_in_executor).

