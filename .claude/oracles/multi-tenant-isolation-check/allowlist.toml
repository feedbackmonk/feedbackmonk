# --- FR-FBR-28 addition (sentiment-trend query-param enum / migration 00017) ---

[[inherent_methods]]
type_name = "TrendBucket"
method = "parse"
rationale = "Pure value-parser on the sentiment-trend time-bucket enum (FR-FBR-28) — NOT a repository data-access method. `TrendBucket::parse(&str) -> Option<TrendBucket>` maps a query-param string (day|week|month) to a fixed enum; it touches no DB and needs no scope. The consuming repo method `FeedbackRepo::sentiment_trend(&self, scope: &ProjectScope, bucket: TrendBucket, since)` IS scope-protected (Probe B compliant). The enum lives in the repository crate because it is the typed input to that repo method (same locality as other repo-input types). `as_trunc_unit` is &self-only (oracle accepts)."
