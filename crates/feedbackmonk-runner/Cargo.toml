[package]
name = "feedbackmonk-runner"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# The runner is shipped as a binary (`feedbackmonk-runner`) + a library (so the
# C24 corpus + unit tests can drive the pure prompt-assembly / sanitizer
# surfaces without spawning a process).
[lib]
name = "feedbackmonk_runner"
path = "src/lib.rs"

[[bin]]
name = "feedbackmonk-runner"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
# Reused by the outbound sanitizer (Worker A, Stage 1) — the canonical
# 20-pattern PII scrubber chokepoint (FR-FBR-10 / C27 25c).
feedbackmonk-tracing = { path = "../feedbackmonk-tracing" }
# Shared domain types (ActionType, WorkOrderState, ...).
feedbackmonk-core = { path = "../feedbackmonk-core" }

[lints]
workspace = true
