<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>feedbackmonk widget — signed-in host fixture</title>
    <!--
      Test fixture for DEC-FBR-IMPL-35: a host page whose signed-in user's token
      is served at a same-origin endpoint (data-token-url) rather than baked into
      the page. The spec routes /e2e/mock/token to answer as signed in, signed
      out, or failing. Loaded by widget/e2e/widget-a11y.spec.ts.
    -->
    <link rel="stylesheet" href="../dist/widget.css" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; color: #111; }
    </style>
  </head>
  <body>
    <main>
      <h1>Signed-in host fixture</h1>
    </main>
    <script
      type="module"
      src="../dist/widget.js"
      data-project-id="00000000-0000-0000-0000-000000000001"
      data-api-base="http://localhost:14206/e2e/mock"
      data-token-url="/e2e/mock/token"
    ></script>
  </body>
</html>
