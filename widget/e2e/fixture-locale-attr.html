<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `data-locale` fixture (Contract C36) — and the RTL case (TGF-…-02).

      The host page says `lang="en"` and the browser will be driven with
      `de-DE`, while the embed asks for Persian. All three disagree on purpose:
      the widget must follow the EMBED, because the embedder is the only party
      that knows what language it is rendering the surrounding page in (a
      GitCellar `/de/pricing` page whose shell is still lang="en", say).

      Persian is also the one right-to-left locale in the C34 table, so this is
      where `dir="rtl"` on `.fbm-root` gets asserted end to end.
    -->
    <title>feedbackmonk widget — data-locale fixture</title>
    <link rel="stylesheet" href="../dist/widget.css" />
  </head>
  <body>
    <main>
      <h1>feedbackmonk widget — data-locale fixture</h1>
      <p>Host page is English, browser is German, the embed asks for Persian.</p>
    </main>
    <script
      type="module"
      src="../dist/widget.js"
      data-project-id="00000000-0000-0000-0000-000000000001"
      data-api-base="http://localhost:14206/e2e/mock"
      data-locale="fa"
    ></script>
  </body>
</html>
